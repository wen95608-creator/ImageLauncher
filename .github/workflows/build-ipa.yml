name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Convert AppIcon JPEG to 1024 PNG (sips)
        run: |
          cd "ImageLauncher/Assets.xcassets/AppIcon.appiconset"
          sips -s format png -z 1024 1024 "图标.jpg" --out "appicon-1024.png"
          ls -la

      - name: Show project structure
        run: |
          ls -la
          echo "---"
          ls -la ImageLauncher.xcodeproj || true

      - name: Archive (no signing)
        run: |
          xcodebuild -project ImageLauncher.xcodeproj \
            -scheme ImageLauncher -configuration Release \
            -sdk iphoneos \
            -archivePath build/ImageLauncher.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Package unsigned IPA
        run: |
          cd build
          rm -rf Payload ImageLauncher.ipa
          mkdir Payload
          cp -R "ImageLauncher.xcarchive/Products/Applications/ImageLauncher.app" Payload/
          zip -r ImageLauncher.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageLauncher-unsigned-ipa
          path: build/ImageLauncher.ipa
          if-no-files-found: error
